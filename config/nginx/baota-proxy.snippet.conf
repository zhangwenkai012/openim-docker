# 宝塔每个 dsvxt.cn 子域站点：目标统一 18080，发送域名必须是 $host（不能填 127.0.0.1）
#
# 需绑定到 18080 的域名：
#   chat-api.dsvxt.cn  api.dsvxt.cn  ws.dsvxt.cn  file.dsvxt.cn
#   h5.dsvxt.cn  download.dsvxt.cn  admin.dsvxt.cn  admin1.dsvxt.cn
#
# ws.dsvxt.cn 请改用 baota-proxy-ws.snippet.conf（86400s 超时）
#
# 不要绑定到 18080（继续直连原端口）：
#   grafana.dsvxt.cn → 127.0.0.1:13000
#
# 建议：h5.dsvxt.cn 站点 SSL 关闭 HTTP/2（避免 ERR_HTTP2_PROTOCOL_ERROR）
# 建议：file / api / chat-api / admin 站点加 client_max_body_size 0（大文件上传）

location ^~ / {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 60s;
    proxy_read_timeout 600s;
    client_max_body_size 0;
}