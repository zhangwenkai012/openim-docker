# 宝塔 h5.* 站点专用反代（iOS 主屏书签 / WebClip 冷启动）
#
# 面板操作（必做）：
#   1. 站点 SSL → 关闭 HTTP/2（只保留 HTTP/1.1）
#   2. 将下方 H5_PUBLIC_HOST 改成实际域名，例如 h5.ttocuxe.xyz
#   3. 粘贴到「配置文件」或「反向代理」自定义配置
#
# 原因：WebClip 冷启动 GET / 偶发 400，多为 HTTP/2 + Host 头在多层反代中异常；
#       固定 Host + HTTP/1.1 可显著降低概率。

# 将此处改成你的 h5 域名（不要带 https://）
# H5_PUBLIC_HOST=h5.ttocuxe.xyz

large_client_header_buffers 4 32k;

location ^~ / {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    # 固定 Host，避免 iOS 冷启动时 $host 为空导致下游 nginx 400
    proxy_set_header Host h5.ttocuxe.xyz;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host h5.ttocuxe.xyz;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 60s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 0;
}
