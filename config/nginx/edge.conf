# =============================================================================
# openim-edge 统一网关（宝塔 SSL → http://127.0.0.1:18080，发送域名必须是 $host）
#
# 域名一览（与宝塔 *.dsvxt.cn 对齐）：
#   chat-api.dsvxt.cn  → Chat API (10008)           Android 验证码/登录
#   api.dsvxt.cn       → OpenIM API (10002)          Android SDK / object
#   ws.dsvxt.cn        → Msg Gateway (10001)         Android WebSocket
#   file.dsvxt.cn      → MinIO (9000)                头像/文件
#   h5.dsvxt.cn        → openim-h5 容器              浏览器 H5（容器内 /im-gateway /chat-api /im-ws）
#   admin.dsvxt.cn     → im-admin 容器               自研后台（容器内 /admin-api /chat-api /im-gateway）
#   admin1.dsvxt.cn    → 官方 admin-front + 四条 API  官方后台（见下方 admin1 server）
#
# 未纳入 edge（宝塔继续直连端口）：
#   grafana.dsvxt.cn   → 13000（host 网络，不在 compose bridge）
#   可选 PC 端 web.dsvxt.cn → 见文件末尾注释块
# =============================================================================

include /etc/nginx/edge-upstreams.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 宝塔 SSL 终止后转发到 edge 为 HTTP，需读 X-Forwarded-Proto 还原 https
map $http_x_forwarded_proto $edge_scheme {
    default $scheme;
    https   https;
    http    http;
}

# ---------- chat-api.dsvxt.cn → Chat API ----------
server {
    listen 80;
    server_name chat-api.dsvxt.cn;

    client_max_body_size 0;

    location / {
        proxy_pass http://edge_chat_api;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# ---------- api.dsvxt.cn → OpenIM HTTP API ----------
server {
    listen 80;
    server_name api.dsvxt.cn;

    client_max_body_size 0;

    location / {
        proxy_pass http://edge_im_api;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_set_header X-Request-Api $edge_scheme://$host;
        proxy_read_timeout 600s;
    }
}

# ---------- ws.dsvxt.cn → Msg Gateway（Android 直连根路径） ----------
server {
    listen 80;
    server_name ws.dsvxt.cn;

    location / {
        proxy_pass http://edge_msg_gateway;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 86400s;
    }
}

# ---------- file.dsvxt.cn → MinIO（注意 Host 必须用 $http_host） ----------
server {
    listen 80;
    server_name file.dsvxt.cn;

    location / {
        proxy_pass http://edge_minio;
        include /etc/nginx/conf.d/edge-minio.inc;
    }
}

# ---------- h5.dsvxt.cn → H5（容器内再分 /im-gateway /chat-api /im-ws） ----------
server {
    listen 80;
    server_name h5.dsvxt.cn;

    client_max_body_size 0;

    location / {
        proxy_pass http://edge_h5;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 86400s;
    }
}

# ---------- admin.dsvxt.cn → 自研 im-admin ----------
server {
    listen 80;
    server_name admin.dsvxt.cn;

    client_max_body_size 0;

    location / {
        proxy_pass http://edge_im_admin;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# ---------- admin1.dsvxt.cn → 官方 openim-admin-front ----------
# 官方 HTTPS 域名模式必须包含以下 5 类路径（缺一不可）：
#   /complete_admin/ → admin-api 10009
#   /chat/           → chat-api 10008
#   /api/            → openim-api 10002（含 /api/object/）
#   /msg_gateway     → msg-gateway 10001（注意 proxy_pass 尾斜杠）
#   /                → admin-front 静态页
server {
    listen 80;
    server_name admin1.dsvxt.cn;

    client_max_body_size 0;

    location ^~ /complete_admin/ {
        proxy_pass http://edge_admin_api/;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }

    location ^~ /chat/ {
        proxy_pass http://edge_chat_api/;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }

    location ^~ /api/ {
        proxy_pass http://edge_im_api/;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_set_header X-Request-Api $edge_scheme://$host/api;
        proxy_read_timeout 600s;
    }

    # 官方：proxy_pass 必须带尾斜杠，/msg_gateway → 10001 根路径
    location ^~ /msg_gateway {
        proxy_pass http://edge_msg_gateway/;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://edge_admin_front;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# 根域名可选：跳转到 H5（需要时在宝塔也绑定 dsvxt.cn）
server {
    listen 80;
    server_name dsvxt.cn www.dsvxt.cn;

    return 301 https://h5.dsvxt.cn$request_uri;
}

# 未知 Host（宝塔若发送域名不是 $host 会命中此处，返回 404 便于排查）
server {
    listen 80 default_server;
    server_name _;

    default_type text/plain;
    return 404 "openim-edge: unknown host \"$http_host\"\n";
}

