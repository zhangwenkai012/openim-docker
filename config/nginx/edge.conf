# 统一边缘网关：宝塔各域名 SSL 终止后，proxy_pass http://127.0.0.1:${EDGE_HTTP_PORT}
# Host 头保持原域名，由本配置按 server_name 分发到 Compose 内网服务。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- chat-api.dsvxt.cn → openim-chat:10008（Android / 原生客户端） ----------
server {
    listen 80;
    server_name chat-api.dsvxt.cn;

    location / {
        proxy_pass http://openim-chat:10008;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# ---------- api.dsvxt.cn → openim-server:10002 ----------
server {
    listen 80;
    server_name api.dsvxt.cn;

    location / {
        proxy_pass http://openim-server:10002;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_set_header X-Request-Api $scheme://$host;
        proxy_read_timeout 600s;
    }
}

# ---------- ws.dsvxt.cn → openim-server:10001（WebSocket） ----------
server {
    listen 80;
    server_name ws.dsvxt.cn;

    location / {
        proxy_pass http://openim-server:10001;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 86400s;
    }
}

# ---------- file.dsvxt.cn → minio:9000 ----------
server {
    listen 80;
    server_name file.dsvxt.cn;

    client_max_body_size 0;

    location / {
        proxy_pass http://minio:9000;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# ---------- h5.dsvxt.cn → openim-h5（容器内已含 /im-gateway、/chat-api、/im-ws） ----------
server {
    listen 80;
    server_name h5.dsvxt.cn;

    location / {
        proxy_pass http://openim-h5:80;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# ---------- admin.dsvxt.cn → im-admin（容器内已含 /admin-api、/chat-api、/im-gateway） ----------
server {
    listen 80;
    server_name admin.dsvxt.cn;

    location / {
        proxy_pass http://im-admin:80;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# ---------- admin1.dsvxt.cn → 官方 openim-admin-front + API 路径 ----------
server {
    listen 80;
    server_name admin1.dsvxt.cn;

    location ^~ /complete_admin/ {
        proxy_pass http://openim-chat:10009/;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }

    location ^~ /chat/ {
        proxy_pass http://openim-chat:10008/;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://openim-admin-front:80;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# 未知 Host 直接拒绝，避免误配域名落到错误 upstream
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
