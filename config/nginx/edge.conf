# =============================================================================
# openim-edge 统一网关（宝塔 SSL → http://127.0.0.1:18080，发送域名必须是 $host）
#
# 域名路由：只认子域名前缀（与主域无关），例如：
#   h5.dsvxt.cn / h5.qidianxueyuan.com.cn → openim-h5
#   admin.* / api.* / ws.* / chat-api.* / livekit.* / file.* / download.* / admin1.*
#
# 前缀一览：
#   chat-api.*  → Chat API (10008)           Android 验证码/登录
#   api.*       → OpenIM API (10002)          Android SDK / object
#   ws.*        → Msg Gateway (10001)         Android WebSocket
#   livekit.*   → LiveKit (7880)              语音通话 WebRTC 信令 WSS
#   file.*      → MinIO (9000)                头像/文件
#   h5.*        → openim-h5 容器              浏览器 H5（容器内 /im-gateway /chat-api /im-ws）
#   download.*  → edge 静态页                 APP 下载落地页（nginx 直出，/chat-api 反代）
#   admin.*     → im-admin 容器               自研后台（容器内 /admin-api /chat-api /im-gateway）
#   admin1.*    → 官方 admin-front + 四条 API  官方后台（见下方 admin1 server）
#
# 未纳入 edge（宝塔继续直连端口）：
#   grafana.dsvxt.cn   → 13000（host 网络，不在 compose bridge）
#   可选 PC 端 web.dsvxt.cn → 见文件末尾注释块
# =============================================================================

include /etc/nginx/edge-upstreams.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 宝塔 SSL 终止后转发到 edge 为 HTTP，需读 X-Forwarded-Proto 还原 https
map $http_x_forwarded_proto $edge_scheme {
    default $scheme;
    https   https;
    http    http;
}

# h5.xxx.com → xxx.com，用于 /download 跳转到 download.xxx.com
map $host $edge_base_domain {
    ~^[^.]+\.(.+)$  $1;
    default         $host;
}

# apex / www 根域 → 同主域 h5 子域
map $host $edge_apex_h5_host {
    ~^www\.(.+)$  h5.$1;
    default       h5.$host;
}

# h5 反代：优先 Host，其次宝塔传来的 X-Forwarded-Host，避免空 Host 打到容器 nginx 400
map $http_host $edge_h5_host {
    default $http_host;
    ""      $http_x_forwarded_host;
}

# ---------- chat-api.dsvxt.cn → Chat API ----------
server {
    listen 80;
    server_name ~^chat-api\.;

    client_max_body_size 0;

    location / {
        set $upstream_chat_api openim-chat:10008;
        proxy_pass http://$upstream_chat_api;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# ---------- api.dsvxt.cn → OpenIM HTTP API ----------
server {
    listen 80;
    server_name ~^api\.;

    client_max_body_size 0;

    location / {
        set $upstream_im_api openim-server:10002;
        proxy_pass http://$upstream_im_api;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_set_header X-Request-Api $edge_scheme://$host;
        proxy_read_timeout 600s;
    }
}

# ---------- ws.dsvxt.cn → Msg Gateway（Android 直连根路径） ----------
server {
    listen 80;
    server_name ~^ws\.;

    location / {
        set $upstream_msg_gateway openim-server:10001;
        proxy_pass http://$upstream_msg_gateway;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 86400s;
    }
}

# ---------- livekit.dsvxt.cn → LiveKit WebRTC 信令 ----------
server {
    listen 80;
    server_name ~^livekit\.;

    location / {
        set $upstream_livekit livekit:7880;
        proxy_pass http://$upstream_livekit;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 86400s;
    }
}

# ---------- file.dsvxt.cn → MinIO（注意 Host 必须用 $http_host） ----------
server {
    listen 80;
    server_name ~^file\.;

    location / {
        set $upstream_minio minio:9000;
        proxy_pass http://$upstream_minio;
        include /etc/nginx/conf.d/edge-minio.inc;
    }
}

# ---------- download.dsvxt.cn → 静态下载页（不走 H5 WASM） ----------
server {
    listen 80;
    server_name ~^download\.;

    root /var/www/download;
    index index.html;

    location ^~ /chat-api/ {
        # set 必须在 rewrite break 之前（break 会跳过后续 rewrite 模块指令）
        set $upstream_chat_api openim-chat:10008;
        rewrite ^/chat-api/(.*)$ /$1 break;
        proxy_pass http://$upstream_chat_api;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }

    location = /ios/install {
        try_files /ios-install.html =404;
    }

    location = / {
        try_files /index.html =404;
    }
}

# ---------- h5.dsvxt.cn → H5（容器内再分 /im-gateway /chat-api /im-ws） ----------
server {
    listen 80;
    server_name ~^h5\.;

    client_max_body_size 0;
    large_client_header_buffers 4 32k;

    location = /download {
        return 301 $edge_scheme://download.$edge_base_domain/;
    }

    location ^~ /download/ {
        return 301 $edge_scheme://download.$edge_base_domain/;
    }

    location / {
        set $upstream_h5 openim-h5:80;
        proxy_pass http://$upstream_h5;
        include /etc/nginx/conf.d/edge-h5-proxy.inc;
        proxy_read_timeout 86400s;
    }
}

# ---------- admin.dsvxt.cn → 自研 im-admin ----------
server {
    listen 80;
    server_name ~^admin\.;

    client_max_body_size 0;

    location / {
        set $upstream_im_admin im-admin:80;
        proxy_pass http://$upstream_im_admin;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# ---------- admin1.dsvxt.cn → 官方 openim-admin-front ----------
# 官方 HTTPS 域名模式必须包含以下 5 类路径（缺一不可）：
#   /complete_admin/ → admin-api 10009
#   /chat/           → chat-api 10008
#   /api/            → openim-api 10002（含 /api/object/）
#   /msg_gateway     → msg-gateway 10001（注意 proxy_pass 尾斜杠）
#   /                → admin-front 静态页
server {
    listen 80;
    server_name ~^admin1\.;

    client_max_body_size 0;

    location ^~ /complete_admin/ {
        set $upstream_admin_api openim-chat:10009;
        rewrite ^/complete_admin/(.*)$ /$1 break;
        proxy_pass http://$upstream_admin_api;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }

    location ^~ /chat/ {
        set $upstream_chat_api openim-chat:10008;
        rewrite ^/chat/(.*)$ /$1 break;
        proxy_pass http://$upstream_chat_api;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }

    location ^~ /api/ {
        set $upstream_im_api openim-server:10002;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_im_api;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_set_header X-Request-Api $edge_scheme://$host/api;
        proxy_read_timeout 600s;
    }

    # 官方：/msg_gateway → 10001 根路径（变量 proxy_pass 需 rewrite 去前缀）
    location ^~ /msg_gateway {
        set $upstream_msg_gateway openim-server:10001;
        rewrite ^/msg_gateway/?(.*)$ /$1 break;
        proxy_pass http://$upstream_msg_gateway;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 86400s;
    }

    location / {
        set $upstream_admin_front openim-admin-front:80;
        proxy_pass http://$upstream_admin_front;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# 根域名可选：跳转到同主域 H5（宝塔绑定 apex 时生效）
server {
    listen 80;
    server_name dsvxt.cn www.dsvxt.cn qidianxueyuan.com.cn www.qidianxueyuan.com.cn;

    return 301 $edge_scheme://$edge_apex_h5_host$request_uri;
}

# 未知 Host（宝塔若发送域名不是 $host 会命中此处，返回 404 便于排查）
server {
    listen 80 default_server;
    server_name _;

    default_type text/plain;
    return 404 "openim-edge: unknown host \"$http_host\"\n";
}

