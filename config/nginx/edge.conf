# 统一边缘网关：宝塔 SSL 终止后 proxy_pass http://127.0.0.1:18080
# 宝塔必须发送 Host $host（见下方注释），否则 unknown-host 会 404 而非误路由。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker 内网 DNS；proxy_pass 用变量时需 resolver，且避免容器未就绪时解析失败
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------- chat-api.dsvxt.cn → openim-chat:10008 ----------
server {
    listen 80;
    server_name chat-api.dsvxt.cn;

    location / {
        set $upstream openim-chat:10008;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# ---------- api.dsvxt.cn → openim-server:10002 ----------
server {
    listen 80;
    server_name api.dsvxt.cn;

    location / {
        set $upstream openim-server:10002;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_set_header X-Request-Api $scheme://$host;
        proxy_read_timeout 600s;
    }
}

# ---------- ws.dsvxt.cn → openim-server:10001 ----------
server {
    listen 80;
    server_name ws.dsvxt.cn;

    location / {
        set $upstream openim-server:10001;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 86400s;
    }
}

# ---------- file.dsvxt.cn → minio:9000 ----------
server {
    listen 80;
    server_name file.dsvxt.cn;

    client_max_body_size 0;

    location / {
        set $upstream minio:9000;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# ---------- h5.dsvxt.cn → openim-h5 ----------
server {
    listen 80;
    server_name h5.dsvxt.cn;

    location / {
        set $upstream openim-h5:80;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# ---------- admin.dsvxt.cn → im-admin ----------
server {
    listen 80;
    server_name admin.dsvxt.cn;

    location / {
        set $upstream im-admin:80;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# ---------- admin1.dsvxt.cn → 官方 openim-admin-front + API ----------
# 官方文档需同时反代：/complete_admin/ → 10009，/chat/ → 10008，/api/ → 10002
server {
    listen 80;
    server_name admin1.dsvxt.cn;

    location ^~ /complete_admin/ {
        rewrite ^/complete_admin/?(.*)$ /$1 break;
        set $upstream openim-chat:10009;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }

    location ^~ /chat/ {
        rewrite ^/chat/?(.*)$ /$1 break;
        set $upstream openim-chat:10008;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }

    location ^~ /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        set $upstream openim-server:10002;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_set_header X-Request-Api $scheme://$host/api;
        proxy_read_timeout 600s;
    }

    location /msg_gateway {
        set $upstream openim-server:10001;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 86400s;
    }

    location / {
        set $upstream openim-admin-front:80;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/edge-proxy.inc;
        proxy_read_timeout 600s;
    }
}

# 未匹配的 Host：返回 404（勿用 444，否则宝塔会显示 502）
server {
    listen 80 default_server;
    server_name _;

    default_type text/plain;
    return 404 "openim-edge: unknown host \"$http_host\"\n";
}
