<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>安装到 iPhone</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #f5f7ff;
        color: #333;
      }
      .bar {
        display: flex;
        align-items: center;
        height: 3rem;
        padding: 0 1rem;
        background: #fff;
        border-bottom: 1px solid #eee;
        font-size: 1rem;
        font-weight: 600;
      }
      .content { padding: 1rem 1.25rem 2rem; }
      .desc { margin-bottom: 1rem; font-size: 0.875rem; line-height: 1.6; color: #666; }
      .btn {
        display: block;
        width: 100%;
        height: 3rem;
        margin-bottom: 1.5rem;
        border: 0;
        border-radius: 9999px;
        background: #12b7f5;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      ol { list-style: none; }
      li { display: flex; gap: 0.75rem; margin-bottom: 1rem; font-size: 0.875rem; line-height: 1.6; color: #444; }
      .num {
        flex-shrink: 0;
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 9999px;
        background: #12b7f5;
        color: #fff;
        font-size: 0.75rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tip { margin-top: 1.5rem; font-size: 0.75rem; line-height: 1.5; color: #999; }
    </style>
  </head>
  <body>
    <div class="bar">安装到 iPhone</div>
    <div class="content">
      <p class="desc">通过安装描述文件，在桌面添加快捷方式。安装后点击图标即可全屏打开应用。</p>
      <button type="button" class="btn" id="dlBtn" disabled>下载描述文件</button>
      <ol>
        <li><span class="num">1</span><span>点击上方按钮下载描述文件，并在弹窗中选择「允许」。</span></li>
        <li><span class="num">2</span><span>打开 iPhone「设置」→「通用」→「VPN 与设备管理」。</span></li>
        <li><span class="num">3</span><span>在「已下载的描述文件」中点击刚下载的配置。</span></li>
        <li><span class="num">4</span><span>点击右上角「安装」，按提示完成安装。</span></li>
        <li><span class="num">5</span><span>返回桌面，点击新图标即可打开应用。</span></li>
      </ol>
      <p class="tip">若提示「未签名」，在系统设置中确认安装即可；需使用 Safari 打开。</p>
    </div>
    <script>
      ;(function () {
        var url = location.origin + '/chat-api/ios/webclip'
        var btn = document.getElementById('dlBtn')
        btn.disabled = false
        btn.onclick = function () {
          location.href = url
        }
      })()
    </script>
  </body>
</html>
