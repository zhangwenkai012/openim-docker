<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1220" />
    <title>下载鸽聊</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        color: #fff;
        background: linear-gradient(165deg, #0b1220 0%, #132238 42%, #0c1f3d 100%);
        overflow-x: hidden;
      }
      .mesh {
        pointer-events: none;
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(56, 132, 255, 0.22), transparent 55%),
          radial-gradient(ellipse 60% 40% at 100% 80%, rgba(30, 90, 200, 0.12), transparent 50%),
          radial-gradient(ellipse 50% 35% at 0% 70%, rgba(20, 70, 160, 0.1), transparent 45%);
      }
      .wrap {
        position: relative;
        z-index: 1;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3.5rem 1.5rem;
      }
      .glow {
        pointer-events: none;
        position: absolute;
        top: 18%;
        width: 14rem;
        height: 14rem;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(64, 140, 255, 0.18) 0%, transparent 70%);
        filter: blur(2px);
      }
      .logo {
        width: 5.75rem;
        height: 5.75rem;
        border-radius: 1.375rem;
        background: #12b7f5;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.625rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 24px rgba(0, 0, 0, 0.25);
      }
      .card {
        width: 100%;
        max-width: 22.5rem;
        margin-top: 2.5rem;
        padding: 2rem 1.75rem;
        border-radius: 1.75rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.04) 100%);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(20px);
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.75rem;
      }
      .chip-icon {
        width: 3rem;
        height: 3rem;
        border-radius: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
      }
      .chip--android .chip-icon { color: #7ee8a0; background: rgba(52, 199, 89, 0.12); border-color: rgba(52, 199, 89, 0.2); }
      .chip--pc .chip-icon { color: #9ec5ff; background: rgba(64, 140, 255, 0.14); border-color: rgba(64, 140, 255, 0.22); }
      .chip--ios .chip-icon { color: #f0f0f5; background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.16); }
      .chip-label { font-size: 1.0625rem; font-weight: 500; color: rgba(255, 255, 255, 0.95); }
      .btn {
        display: block;
        width: 100%;
        height: 3.25rem;
        border: 0;
        border-radius: 9999px;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #3b9eff 0%, #1a6fe8 100%);
        box-shadow: 0 8px 28px rgba(26, 111, 232, 0.45);
      }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
      .hint { text-align: center; font-size: 0.9375rem; color: rgba(255, 255, 255, 0.55); }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="mesh" aria-hidden="true"></div>
    <main class="wrap">
      <div class="glow" aria-hidden="true"></div>
      <header style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div class="logo" id="logoBox" aria-hidden="true">
          <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path opacity="0.95" d="M14 10h24c3.3 0 6 2.7 6 6v14c0 3.3-2.7 6-6 6H22l-8 7v-7h-4c-3.3 0-6-2.7-6-6V16c0-3.3 2.7-6 6-6z" fill="white"/>
            <ellipse cx="34" cy="22" rx="7" ry="6" fill="#12B7F5" opacity="0.35"/>
          </svg>
        </div>
        <h1 id="brandTitle">鸽聊</h1>
      </header>

      <section id="cardReady" class="card hidden">
        <div class="chip" id="chipRow">
          <span class="chip-icon" id="chipIcon"></span>
          <div><p class="chip-label" id="chipLabel"></p></div>
        </div>
        <button type="button" class="btn" id="downloadBtn"></button>
      </section>

      <section id="cardUnsupported" class="card hidden">
        <p class="hint">请使用手机或电脑访问</p>
      </section>
    </main>
    <script>
      ;(function () {
        var ICONS = {
          android:
            '<svg class="h-7 w-7" width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M7 4l-1.2 2.1M17 4l1.2 2.1M8 18h8M6 8h12a2 2 0 012 2v6a2 2 0 01-2 2H6a2 2 0 01-2-2v-6a2 2 0 012-2z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="9.5" cy="12" r="0.9" fill="currentColor"/><circle cx="14.5" cy="12" r="0.9" fill="currentColor"/></svg>',
          pc: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
          ios: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="7" y="2.5" width="10" height="19" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 5.5h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="18.5" r="0.9" fill="currentColor"/></svg>',
        }
        var COPY = {
          android: { label: '安卓客户端', action: '立即下载' },
          pc: { label: '电脑客户端', action: '下载安装包' },
          ios: { label: '苹果客户端', action: '安装到桌面' },
          unavailable: '暂不可用',
        }

        function detectPlatform(ua) {
          ua = ua || navigator.userAgent
          if (/android/i.test(ua)) return 'android'
          if (/iPad|iPhone|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))
            return 'ios'
          if (/Windows|Macintosh|Linux|CrOS/i.test(ua) && !/Mobile|Android/i.test(ua)) return 'pc'
          return 'unknown'
        }

        function isInternal(url) {
          if (!url) return false
          try {
            return new URL(url, location.origin).origin === location.origin
          } catch (e) {
            return url.charAt(0) === '/'
          }
        }

        function resolveLink(url) {
          if (!url) return ''
          if (isInternal(url)) {
            try {
              var t = new URL(url, location.origin)
              return t.pathname + t.search + t.hash
            } catch (e) {
              return url
            }
          }
          return url
        }

        function fetchConfig() {
          return fetch('/chat-api/client_config/get', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              operationID: (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()),
            },
            body: '{}',
          })
            .then(function (r) {
              return r.json()
            })
            .then(function (res) {
              return (res && res.data && res.data.config) || {}
            })
            .catch(function () {
              return {}
            })
        }

        function buildConfig(cfg) {
          var origin = location.origin
          return {
            appDisplayName: (cfg.appDisplayName || '').trim() || '鸽聊',
            appIconUrl: (cfg.appIconUrl || '').trim(),
            androidUrl: (cfg.appDownloadDomain || '').trim(),
            pcUrl: (cfg.pcDownloadDomain || '').trim(),
            iosUrl: (cfg.iosDomain || '').trim() || origin + '/ios/install',
          }
        }

        var platform = detectPlatform()
        var cardReady = document.getElementById('cardReady')
        var cardUnsupported = document.getElementById('cardUnsupported')

        if (platform === 'unknown') {
          cardUnsupported.classList.remove('hidden')
          return
        }

        fetchConfig().then(function (raw) {
          var cfg = buildConfig(raw)
          var brand = document.getElementById('brandTitle')
          var logoBox = document.getElementById('logoBox')
          if (cfg.appDisplayName) brand.textContent = cfg.appDisplayName
          document.title = '下载' + cfg.appDisplayName
          if (cfg.appIconUrl) {
            logoBox.innerHTML =
              '<img src="' +
              cfg.appIconUrl +
              '" alt="" style="width:100%;height:100%;border-radius:1.375rem;object-fit:cover" />'
          }

          var urls = { android: cfg.androidUrl, pc: cfg.pcUrl, ios: cfg.iosUrl }
          var url = urls[platform]
          var copy = COPY[platform]

          document.getElementById('chipRow').className = 'chip chip--' + platform
          document.getElementById('chipIcon').innerHTML = ICONS[platform]
          document.getElementById('chipLabel').textContent = copy.label

          var btn = document.getElementById('downloadBtn')
          btn.textContent = url ? copy.action : COPY.unavailable
          btn.disabled = !url

          btn.onclick = function () {
            if (!url) return
            var target = resolveLink(url)
            if (target.charAt(0) === '/') {
              location.href = target
            } else {
              location.href = target
            }
          }

          cardReady.classList.remove('hidden')
        })
      })()
    </script>
  </body>
</html>
